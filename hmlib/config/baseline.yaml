#
# Camera type
#
camera:
  name: "GoPro"
  make: null
  model: null
  output-fps: null
  color:
    white_balance:
      - 1.0
      - 1.0
      - 1.0
    brightness: 1.0
    exposure_ev: 0.0
    contrast: 1.0
    gamma: 1.0
  mount:
    - offset_80:
        resolution: null
    - offset_90:
        resolution: null

#
# Plotting / visualization defaults
#
plot:
  debug_play_tracker: false
  plot_moving_boxes: false
  plot_individual_player_tracking: false
  plot_tracking_circles: true
  plot_boundaries: false
  plot_all_detections: null
  plot_trajectories: false
  plot_speed: false
  plot_jersey_numbers: false
  # Home/away (or dark/light) labels under each tracked player. Drawn from the
  # team feature's output in both applications; see the `team` block below.
  plot_teams: false
  # Badge match officials in the tracking overlay. Two preconditions, and it
  # is inert without either: a detector whose head distinguishes them
  # (--detector-model hockeyref), because a single-class head has no referee
  # index; and plot_individual_player_tracking, because the badges are drawn
  # alongside the per-player boxes.
  plot_referees: true
  plot_actions: false
  plot_pose: false
  plot_ice_mask: false
  #
  # Rink landmark overlay. NOT IMPLEMENTED IN HSTREAM YET: no native code reads
  # these keys; HockeyMON's stitch graph (its rink_overlay node) is the only
  # consumer. They are listed in both copies of this file to keep the two
  # synchronized.
  #
  # Master switch for the stitch graph's rink_overlay node. Off by default, so
  # the node is a no-op stub and nothing is constructed. --plot-ice-mask and
  # --plot-rink-landmarks each set this alongside their own key.
  plot_rink_overlay: false
  # Painted rink features (blue lines, circles, crease, ...) from
  # model.rink_landmarks_segm.
  plot_rink_landmarks: false
  plot_rink_landmark_labels: false
  # null keeps hmlib.segm.rink_landmarks.DEFAULT_SCORE_THRESH.
  rink_landmarks_score_thr: null
  # Downscale before landmark inference. The model was trained on 1008x1008
  # crops, so a full-width panorama is well outside its training distribution;
  # lower this if the detections look wrong.
  rink_landmarks_inference_scale: null
  # Class allow-list; null draws everything except "Field", which covers the
  # whole sheet and is better served by plot_ice_mask.
  rink_landmarks_classes: null

#
# Aspen engine defaults
#
aspen:
  # AspenNet execution settings (serial vs threaded).
  # Modes:
  #   - serial: threaded=false
  #   - threaded: threaded=true, graph=false
  #   - thread-graph: threaded=true, graph=true
  pipeline:
    threaded: true
    graph: true
    queue_size: 2
    max_concurrent: 3
    cuda_streams: true

# Shared Qt rendering size and browser overlay reference coordinates.
preview_reference:
  program_width: 1600
  program_height: 900
  source_width: 1280
  source_height: 720

# Private selectable browser preview. Enabled only by an explicit native
# --web-preview-run-id, with one supervisor-owned WEBRTC sink. The browser
# receives its receipt limits in the native presentation capability.
web_preview:
  width: 1600
  height: 900
  rate_numerator: 30
  rate_denominator: 1
  surface_pool_frames: 3
  conversion_pool_frames: 8
  bitrate: 8000000
  idr_interval: 30
  h264_profile: 0
  encoder_tuning: 3
  rtp_payload: 96
  pending_frames: 64
  pending_events: 256
  presentation_history: 512
  poll_interval_ms: 25
  events_per_batch: 32
  queue_frames: 1
  browser_max_frames: 512
  browser_max_age_ms: 3000
  initial_channel: program

#
# Runtime defaults consumed by Aspen plugins
#
runtime:
  # Valid values: nvvideoconvert, dsxvideoconvert.
  video_converter: "nvvideoconvert"

  # Native HStream AMD Program limits and geometric association. These values
  # do not select a backend or change NVIDIA/Aspen behavior.
  amd:
    gpu_id: 0
    reader_queue_frames: 2
    output_pool_frames: 8
    operation_timeout_ms: 30000
    cancellation_poll_ms: 10
    maximum_inference_io_bytes: 268435456
    maximum_encoded_packet_bytes: 67108864
    maximum_runtime_command_bytes: 8192
    compact_stitch_workspace: true
    playback_start_seconds: 0
    model_cache:
      enable: true
      # {user_cache} follows XDG_CACHE_HOME, otherwise HOME/.cache.
      directory: "{user_cache}/hstream/migraphx"
      maximum_entry_bytes: 2147483648
    audio:
      maximum_packet_bytes: 1048576
      maximum_frame_samples: 4096
      queue_samples: 8192
      bitrate: 192000
    output:
      width: 3840
      height: 2160
      bitrate_kbps: 20000
      keyframe_interval: 60
      realtime: false
      shadow_lift_percent: 0
      lift_shadow_black_point: false
      exposure: 0
    tracker:
      low_score: 0.25
      high_score: 0.6
      new_track_score: 0.7
      high_match_cost: 0.8
      low_match_cost: 0.5
      tentative_match_cost: 0.7
      weight_high_matches_by_score: true
      keep_lost_frames: 30
      confirmation_frames: 2
      maximum_tracks: 512
      maximum_cost_matrix_bytes: 8388608

hstream_ui:
  # Shared Qt/browser tone values use integer slider units, including exposure.
  camera_controls:
    Bring_Up_Shadows: 0
    Lift_Shadow_Black_Point: 0
    Exposure_x100: 0
  runtime_controls:
    debounce_ms: 120
    ack_timeout_ms: 3000
  # Program detector models offered in the Detection tab. config_prefix names a
  # configs/config_infer_*.yaml family: the bare prefix is FP32 and the selected
  # precision appends _fp16/_bf16/_int8. The first entry is the default.
  detector_models:
    - id: default
      label: Default (YOLOv8-m, 1984x736)
      config_prefix: config_infer_yolov8_hockey
    - id: distilled-s
      label: Distilled (YOLOv8-s, 1408x544)
      config_prefix: config_infer_yolov8s_hockey

  drivegpt_database:
    # Initial checkbox state; capture disables seeking for the run.
    enabled: true

# Native player pose cadence and display defaults. Enabling/drawing pose remains
# an explicit choice; these preferences do not enable the model.
pipeline:
  hmstitcher:
    properties:
      # Auto detects source depth; 1 forces P010/FP16, 0 forces standard 8-bit.
      high-bit-depth: auto
  player-analytics:
    pose:
      # Updates per second per player, or "fps" to infer on every video frame.
      # The shared per-frame model-sample budget still applies.
      rate-hz: 10
      # Follow the tracked box between observations for at most 250 ms.
      continuous-drawing: true

apply_camera:
  crop_play_box: false
  crop_output_image: true
  end_zones: false

video_out:
  # Whether to skip final container flush/save in VideoOutput.
  # CLI flag --skip-final-video-save overrides this when provided.
  skip_final_save: false
  # Default NVENC video encoder backend used by VideoOutput / PyNvVideoEncoder.
  # Valid values:
  #   - auto   : let the runtime decide / use library defaults
  #   - pyav   : use the PyAV container muxer
  #   - ffmpeg : use the streaming ffmpeg CLI muxer
  #   - raw    : write a raw elementary bitstream sidecar (.h264/.h265/.ivf)
  #              and invoke ffmpeg once at close() to mux into the container
  # The CLI flag --video-encoder-backend overrides this when provided.
  encoder_backend: "auto"
  output_width: "auto"
  output_height: null
  bit_rate: null  # Auto: scale source bitrate per pixel to the final output dimensions.
  # NVIDIA scaling filter for ENCODE_PROGRAM_4K_FILE sinks. "default" restores
  # the pre-cubic behavior (nearest on CUDA and VIC). Portable names are
  # default, nearest, bilinear, and algo1 through algo4. CUDA aliases are
  # cubic/bicubic, super, and lanczos for algo1 through algo3; on VIC those
  # algorithms are 5-tap, 10-tap, and smart. "nicest" aliases algo4, which is
  # ignored on CUDA and selects nicest on VIC. A direct pipeline.sink*.
  # interpolation-method in an app/overlay YAML wins a same-layer tie.
  program_4k_interpolation: "bilinear"
  show_image: false
  show_scaled: null
  show_youtube: false
  youtube_stream_url: "rtmps://a.rtmps.youtube.com/live2"
  youtube_stream_key: null
  headless_preview_host: "0.0.0.0"
  headless_preview_port: 0
  always_stream: false
  output_video_path: null
  save_frame_dir: null

stitching:
  # Controlled by --aspen-stitching / --no-aspen-stitching.
  aspen-stitching: true
  enabled: true
  # Source-camera lens presets. Hugin consumes horizontal_fov directly; the
  # vertical value is retained with the shared mapping configuration for
  # algorithms that model both axes. Games select a preset with camera_config
  # and may override camera_fov and input_lens in their private config.yaml.
  # Lens defaults depend on recording mode (Wide/Linear, aspect ratio, crop),
  # not just the camera body. Add a separate profile for each calibrated mode.
  # Neutral defaults preserve automatic fitting; measured corrections
  # use full-frame-fisheye, fixed/refine, Hugin a/b/c distortion and
  # center_offset as fractions of the full source width/height.
  # The measured mode catalog below is an optional refinement starting point,
  # not manufacturer factory data. Auto remains the preferred selection.
  # Provenance and conversion: HStream docs/camera-lens-catalog.md.
  camera_configs:
    auto:
      display_name: "Auto (detect recording mode)"
      # Fallback for each automatic field when metadata and verified mode defaults are unavailable.
      horizontal_fov: 108
      vertical_fov: 90
      input_lens:
        projection: rectilinear
        optimization: auto
        distortion: [0, 0, 0]
        center_offset: [0, 0]
    manual:
      display_name: "Manual lens settings"
      horizontal_fov: 108
      vertical_fov: 90
      input_lens:
        projection: rectilinear
        optimization: auto
        distortion: [0, 0, 0]
        center_offset: [0, 0]
    gopro-hero-11:
      display_name: "GoPro Hero 11 (legacy auto fit)"
      # Neutral legacy defaults, not a measured/factory calibration.
      horizontal_fov: 108
      vertical_fov: 90
      input_lens:
        projection: rectilinear
        optimization: auto
        distortion: [0, 0, 0]
        center_offset: [0, 0]
    gopro-mission-1:
      display_name: "GoPro Mission 1"
      # Saved vegas-kings-1 input optics; output projection remains independent.
      horizontal_fov: 108
      vertical_fov: 90
      input_lens:
        projection: full-frame-fisheye
        optimization: fixed
        distortion: [0, 0.0208293582808693, 0]
        center_offset: [-0.0013154349398449218, 0.14355981616751806]
    gopro-mission-1-factory:
      display_name: "GoPro Mission 1 Factory (8K Wide, HyperSmooth On)"
      metadata_match:
        vendor: gopro
        model: MISSION 1 PRO
        width: "7680"
        height: "4320"
        frame_rate: "59.940"
        digital_lens: W
        stabilization: HS EIS
        horizon: "Off"
        zoom: "1"
        projection: GPRO
        warp: identity
        firmware: H26.01.02.02.70
      # MISSION 1 PRO, 7680x4320 at 59.94 fps, Wide, HS EIS, zoom 1,
      # horizon control Off, firmware H26.01.02.02.70. Derived from the
      # recording's GoPro POLY/ZMPL metadata, not published Hugin coefficients.
      # See HStream docs/gopro-mission-1-factory-lens.md for the conversion.
      # Horizontal is Hugin's fitted parameter (actual coverage is ~120 deg);
      # vertical is the camera-reported YFOV, retained for provenance.
      horizontal_fov: 125.12273264898167
      vertical_fov: 70.3657608032227
      input_lens:
        projection: full-frame-fisheye
        optimization: fixed
        distortion: [-0.004931889213955486, 0.04057437656776939, -0.02182075784509423]
        # The embedded radial model assumes a centered image.
        center_offset: [0, 0]
    insta-ace-pro-2:
      display_name: "Insta Ace Pro 2 (legacy auto fit)"
      # Neutral legacy defaults, not a measured/factory calibration.
      horizontal_fov: 108
      vertical_fov: 90
      input_lens:
        projection: rectilinear
        optimization: auto
        distortion: [0, 0, 0]
        center_offset: [0, 0]
    # BEGIN GENERATED CAMERA LENS CATALOG
    # Generated by scripts/convert_camera_lens_catalog.py; do not edit this block.
    # Gyroflow measured approximations (CC0); mode-specific starting values for refinement.
    gopro-hero11-wide-4k60-off-measured:
      display_name: "GoPro HERO11 Black (4K Wide, HS Off, measured)"
      # Source: hero11-wide-16by9.json; gopro-hero11black-wide-3840x2160@59940-no-eis
      metadata_match:
        vendor: "gopro"
        model: "HERO11 Black"
        width: "3840"
        height: "2160"
        frame_rate: ["100.000", "119.880", "23.976", "25.000", "29.970", "50.000", "59.940"]
        digital_lens: "W"
        stabilization: ["N/A", "Off"]
        horizon: "Off"
        zoom: "1"
        projection: "GPRO"
        warp: "identity"
      # 3840x2160 at 59.94 fps. Wide, HyperSmooth Off; no digital zoom or lens mod. Firmware not specified by source. Equivalent frame rates are explicitly listed by the pinned source and recorded in metadata_match.
      # Source RMS 0.267px; conversion max/RMS 2.661/0.613px.
      # Conservative conversion bound 6.918px at 7680px width.
      horizontal_fov: 120.325103761
      vertical_fov: 67.6790012142
      input_lens:
        projection: full-frame-fisheye
        optimization: refine
        distortion: [0.00657126369705, 0.00390449256735, 0.0105523917679]
        center_offset: [0, 0]
    gopro-hero11-wide-4k60-hs-measured:
      display_name: "GoPro HERO11 Black (4K Wide, HS On, measured)"
      # Source: hero11-wide-16by9.json; gopro-hero11black-wide-3840x2160@59940-hseis
      metadata_match:
        vendor: "gopro"
        model: "HERO11 Black"
        width: "3840"
        height: "2160"
        frame_rate: ["100.000", "119.880", "23.976", "25.000", "29.970", "50.000", "59.940"]
        digital_lens: "W"
        stabilization: "HS EIS"
        horizon: "Off"
        zoom: "1"
        projection: "GPRO"
        warp: "identity"
      # 3840x2160 at 59.94 fps. Wide, standard HS EIS; explicit upstream crop 0.928. Not AutoBoost, horizon lock, digital zoom or lens mods. Firmware not specified. Equivalent frame rates are explicitly listed by the pinned source and recorded in metadata_match.
      # Source RMS 0.267px; conversion max/RMS 1.053/0.379px.
      # Conservative conversion bound 3.563px at 7680px width.
      horizontal_fov: 111.970044059
      vertical_fov: 62.9764868283
      input_lens:
        projection: full-frame-fisheye
        optimization: refine
        distortion: [0.00121151084194, 0.0172215026021, -0.00417898490343]
        center_offset: [0, 0]
    gopro-hero11-wide-53k30-off-measured:
      display_name: "GoPro HERO11 Black (5.3K 8:7 Wide, HS Off, measured)"
      # Source: hero11-wide-8by7.json; gopro-hero11black-wide-5312x4648@29970-no-eis
      metadata_match:
        vendor: "gopro"
        model: "HERO11 Black"
        width: "5312"
        height: "4648"
        frame_rate: ["23.976", "25.000", "29.970"]
        digital_lens: "W"
        stabilization: ["N/A", "Off"]
        horizon: "Off"
        zoom: "1"
        projection: "GPRO"
        warp: "identity"
      # 5312x4648 at 29.97 fps. Wide, HyperSmooth Off; no digital zoom or lens mod. Firmware not specified by source. Equivalent frame rates are explicitly listed by the pinned source and recorded in metadata_match.
      # Source RMS 0.963px; conversion max/RMS 2.552/0.688px.
      # Conservative conversion bound 4.453px at 7680px width.
      horizontal_fov: 122.970500756
      vertical_fov: 107.604822114
      input_lens:
        projection: full-frame-fisheye
        optimization: refine
        distortion: [-0.0277893778857, 0.117989259695, -0.0497321030422]
        center_offset: [0, 0]
    gopro-hero11-wide-53k30-hs-measured:
      display_name: "GoPro HERO11 Black (5.3K 8:7 Wide, HS On, measured)"
      # Source: hero11-wide-8by7.json; gopro-hero11black-wide-5312x4648@29970-hseis
      metadata_match:
        vendor: "gopro"
        model: "HERO11 Black"
        width: "5312"
        height: "4648"
        frame_rate: ["23.976", "25.000", "29.970"]
        digital_lens: "W"
        stabilization: "HS EIS"
        horizon: "Off"
        zoom: "1"
        projection: "GPRO"
        warp: "identity"
      # 5312x4648 at 29.97 fps. Wide, standard HS EIS; explicit upstream crop 0.918. Not AutoBoost, horizon lock, digital zoom or lens mods. Firmware not specified. Equivalent frame rates are explicitly listed by the pinned source and recorded in metadata_match.
      # Source RMS 0.963px; conversion max/RMS 1.100/0.670px.
      # Conservative conversion bound 2.511px at 7680px width.
      horizontal_fov: 113.735052269
      vertical_fov: 99.5491445575
      input_lens:
        projection: full-frame-fisheye
        optimization: refine
        distortion: [-0.0248556001693, 0.10867729079, -0.0517705852416]
        center_offset: [0, 0]
    dji-osmo-action-wide-4k30-off-measured:
      display_name: "DJI Osmo Action 1 (4K 29.97 Wide, EIS/dewarp Off, measured)"
      # Source: osmo-action-wide-4k.json; DJI_Osmo Action 1_Default_Wide angle, No Rocksteady or dewarp_4k_16by9_3840x2160-29.97fps
      # 3840x2160 at 29.97003 fps. Original Osmo Action only; Wide, RockSteady Off, dewarp Off. Firmware not specified. Not Action 3/4/5.
      # Source RMS 1.013px; conversion max/RMS 1.259/0.577px.
      # Conservative conversion bound 2.627px at 7680px width.
      horizontal_fov: 119.551984351
      vertical_fov: 67.2784389175
      input_lens:
        projection: full-frame-fisheye
        optimization: refine
        distortion: [-0.0559379020126, 0.190303675111, -0.0881802662087]
        center_offset: [0, 0]
    insta-one-rs-ultrawide-53k25-off-measured:
      display_name: "Insta360 ONE RS (5.3K25 UltraWide 110, EIS Off, module unknown, measured)"
      # Source: insta-one-rs-ultrawide-53k.json; Insta360_OneRS_Ultrawide 110_NO-EIS_5k_16by9_5312x2988-25.00fps
      # 5312x2988 at 25 fps. ONE RS, UltraWide 110, NO-EIS, no SuperView. Source does not identify interchangeable lens module or firmware; experimental starting point. Not Ace Pro 2.
      # Source RMS 0.371px; conversion max/RMS 0.887/0.450px.
      # Conservative conversion bound 1.869px at 7680px width.
      horizontal_fov: 134.54436806
      vertical_fov: 75.6882574571
      input_lens:
        projection: full-frame-fisheye
        optimization: refine
        distortion: [0.010578972891, -0.00340669304704, 0.0178028321194]
        center_offset: [0, 0]
    iphone13pro-ultrawide-1080p30-off-measured:
      display_name: "iPhone 13 Pro (1080p30 13mm, stabilization Off, app unknown, measured)"
      # Source: iphone13pro-ultrawide-1080p.json; Apple_iPhone 13 Pro_13mm_no stabilisation_1080p_16by9_1920x1080-30.01fps
      # 1920x1080 at 30.005781 fps. Built-in 13mm ultrawide, no stabilization. Recording app and firmware unspecified: experimental starting point; verify crop and zoom.
      # Source RMS 0.323px; conversion max/RMS 0.819/0.407px.
      # Conservative conversion bound 3.849px at 7680px width.
      horizontal_fov: 105.295153723
      vertical_fov: 72.7449155975
      input_lens:
        projection: rectilinear
        optimization: refine
        distortion: [0.0377862198157, -0.100202323539, 0.0749036187876]
        center_offset: [0, 0]
    # END GENERATED CAMERA LENS CATALOG
  camera_config: "auto"
  # Independent input-camera sources. Null follows the selector: both Auto for
  # the auto profile, both manual for named profiles. Explicit booleans allow
  # metadata FOV with manual correction, or manual FOV with automatic correction.
  camera_automation:
    fov: null
    lens: null
  # Venue defaults rotate the registered camera pair together, before output
  # projection. A game's projection_framing.rotation_degrees overrides these.
  rink_configs:
    vallco:
      display_name: "Vallco"
      rotation_degrees: [0, -23.8, 4.3]
    sharks-ice:
      display_name: "Sharks Ice"
      rotation_degrees: [0, -15, 0]
    tv-dublin:
      display_name: "TV Dublin"
      rotation_degrees: [0, -23.5, 3.23]
    fremont:
      display_name: "Sharks Ice Fremont"
      rotation_degrees: [0, -15, 0]
  # Final ice-mask frame: null inherits the selected rink, then
  # rink_mask_frame_time_default; auto uses the current first stitched frame.
  # A negative time is relative to the synchronized recording end,
  # independently of Playback start and run limits. Times are
  # [-][[HH:]MM:]SS[.mmm], so -1 and -00:00:01 are the same second.
  rink_mask_frame_time: null
  # Ice-mask frame used when neither the game nor the selected rink names one.
  # Required: there is no compiled-in default. The last second of the recording
  # is cleaner ice than the first stitched frame, which is usually warmup.
  rink_mask_frame_time_default: "-00:00:01"
  # Unselected keeps legacy zero rotation; select a venue in the game config.
  rink_config: null
  pto_project_file: null
  stitch_frame_time: "00:00:00"
  calibration_frame_count: 4
  frame_offsets:
    left: null
    right: null
  control_points:
    m_kpts0: null
    m_kpts1: null
  # Required: there is no compiled-in default, so removing this key is an error.
  # AKAZE needs no model asset, runs on CPU, and aligns rink footage better than
  # SuperPoint + LightGlue in practice. Neural matchers remain explicit choices.
  control_point_matcher: "akaze-hamming"
  # Native automatic matches: independent geometric checks before spatial capping.
  control_point_filtering:
    epipolar_ransac: true
    homography_consistency: true
  # Applies only to SuperPoint, which defaults to 2k on every platform; auto also
  # resolves to 2k. Native and 1k remain explicit choices. Other matchers,
  # including the default AKAZE, retain their fixed processing sizes.
  control_point_resolution: "2k"
  # Neural control-point matchers: cuda (default) or cpu. No automatic CPU fallback.
  control_point_execution_provider: "cuda"
  # Use Hugin alignment and General Panini for the default panorama mapping.
  mapping_backend: "nona"
  projection: "general-panini"
  # Hugin/libpano projection defaults retained per adjustable projection so
  # switching projections in the UI does not discard another projection's tuning.
  projection_parameters:
    albers-equal-area-conic: [0, 60]
    biplane: [45, 0]
    triplane: [60]
    general-panini: [100, 0, 0]
  # Framing applied after Hugin alignment when NONA is selected. Fit the field
  # of view and full canvas automatically; retain 195 degrees for manual FOV.
  projection_framing:
    auto_fov: true
    horizontal_fov: 195
    auto_canvas: true
    auto_crop: false
  # NONA requires Hugin's automatic alignment pass during stitching calibration.
  run_autooptimizer: true
  max_output_dimension: null
  offsets: null
  dir_name: null
  # laplacian mixes the cameras across every scale in the overlap; alpha crossfades over a narrow
  # band at the seam, which preserves detail the detector uses but cannot hide an exposure step.
  blend_mode: "laplacian"
  # Alpha-blend crossfade width, as a fraction of the narrowest camera image. Ignored otherwise.
  blend_feather_fraction: 0.05
  max_blend_levels: 11
  python_blender: false
  # Force using the arbitrary-N CUDA stitcher even when there are only 2 input views.
  use_cuda_pano_n: false
  minimize_blend: false
  dtype: "float32"
  no_cuda_streams: false
  post_stitch_rotate_degrees: null
  capture_rgb_stats: false
  max_output_width: null
  cache_rotation_grid: true
  left_stitch_pipeline:
    - type: HmImageColorAdjust
      keys: [img]
      config_paths:
        - [stitching, left, color]
        - [stitching, left]
      refresh_from_config: true
  right_stitch_pipeline:
    - type: HmImageColorAdjust
      keys: [img]
      config_paths:
        - [stitching, right, color]
        - [stitching, right]
      refresh_from_config: true

play_tracker:
  no_wide_start: true

#
# Detector output constraints. NOT IMPLEMENTED IN HSTREAM YET: no native code
# reads these keys; HockeyMON's detector trunk is the only consumer. Listed in
# both copies of this file to keep the two synchronized.
#
detector:
  # Most officials that can be on the ice at once. The detector scores every
  # box independently and has no way to know this, so it will happily report
  # more; the surplus are relabelled as players, lowest-scoring first.
  #
  # Three suits a one-referee-plus-two-linesmen system. A four-official system
  # (two referees, two linesmen) needs 4, and a two-official youth game can use
  # 2 to be stricter. Only applies to a detector whose head distinguishes
  # officials (--detector-model hockeyref); otherwise inert.
  max_referees: 3

#
# Team affiliation.
#
# Team identity is relative to the game being watched, so there is no model
# that outputs "home" for an arbitrary crop. Both applications take a torso
# crop per track, split the game's players into two appearance groups with a
# two-means fit, and `game.home_is_dark` names those groups.
#
# `enabled`, `warmup_samples`, `refit_interval` and `min_margin` mean the same
# thing to both and are read by both. The rest belong to one side: `backend`,
# `frame_stride`, `min_track_height` and `prtreid` are HockeyMON's, `rate_hz`
# and `model` are HStream's, and each application ignores the other's as
# elsewhere in this file.
#
team:
  # Off by default. Turning it on with backend `prtreid` requires that package
  # to be installed; it is deliberately not a silent fallback to `lab`.
  enabled: false

  # `prtreid` is the SoccerNet Game State Reconstruction baseline. Multi-task
  # training against team labels made its embedding team-discriminative, and
  # that is what transfers to hockey: on a real clip a two-means split of the
  # embedding separated the two squads 1004/1289 with 78% of crops above the
  # assignment margin. Weights download from Zenodo on first use.
  # `lab` is the dependency-free alternative: mean CIELAB colour of the torso.
  # It is weaker but needs no extra install.
  backend: prtreid

  # Crops to collect before the first two-means fit. Fitting on a handful taken
  # from one end of the rink yields two centroids that both describe the same
  # team.
  #
  # Not the delay before a badge appears: the sides are named only once two
  # consecutive fits agree on which group is darker, so the first label is
  # `warmup_samples + refit_interval` crops in -- roughly six seconds of play
  # at the defaults, longer on a clip where `min_track_height` filters most
  # tracks. One noisy window naming the sides for the rest of the game is the
  # failure that buys.
  warmup_samples: 200
  # Crops between fits before the centroids are recomputed, so lighting drift
  # across a period is tracked rather than averaged against first-period crops.
  refit_interval: 600
  # Normalised centroid-distance gap below which a crop is left UNKNOWN rather
  # than assigned on a coin flip. Goalies and partial crops land here.
  min_margin: 0.12
  # Process every Nth frame. Affiliation changes far more slowly than pose.
  frame_stride: 2
  # Tracks shorter than this are mostly ice once cropped to the torso. A 20px
  # box leaves a 7x5 band to upscale; a few pixels of flat colour tell the
  # model nothing and still occupy the fit.
  min_track_height: 60

  # HStream only. Per-track inference rate, not a frame rate: affiliation is
  # static, so a low rate costs no accuracy. A track also leaves the schedule
  # outright once its vote commits, which is what makes the feature cheap
  # enough to leave on.
  rate_hz: 2
  # HStream only. NVIDIA TAO ReIdentificationNet. Scored 89.5% against
  # PRTReid's 86.8% on the same hand-labelled hockey crops and ran 1.34x
  # faster, so the native side ships the generic re-identification embedding
  # even though HockeyMON's `backend` above defaults to the team-trained one.
  model: reidentificationnet-deployable-v1.2
  # Mean CIELAB L the two groups must differ by before they are
  # named dark and light. The chest band takes in ice, boards and other
  # players, so per-crop lightness is noisy; under about this much true
  # separation the ranking is a coin flip that lands differently at every
  # refit, and every badge on screen would swap HOME for AWAY together.
  # Unranked is reported as no badge, which is honest rather than wrong.
  min_lightness_gap: 6.0
  # Smallest share of the window either group may hold. Two
  # squads split roughly evenly; a lopsided split means the fit separated
  # something else, most often the officials from everyone else when the two
  # sweaters are close in appearance. Refusing to name that is better than
  # badging every skater the same and the referees the opposite.
  min_cluster_share: 0.25
  # HStream only. Margin-weighted evidence a group must accumulate before a
  # track's side is called, and the factor by which a challenger must beat the
  # incumbent to take it afterwards. Roughly two confident reads to commit, so
  # one stray crop cannot name a skater.
  acquisition_evidence: 1.0
  switch_hysteresis: 1.35

  prtreid:
    # Empty means "download to the torch hub cache on first use".
    weights: ""
    backbone_weights: ""
    device: cuda

ice_boundaries:
  raise_bbox_center_by_height_ratio: -0.1
  lower_bbox_bottom_by_height_ratio: 0.1

#
# Rink config
#
rink:
  name: null
  location:
    city: null
    state: null
    country: null
  dimensions:
    length: null
    width: null
    corner_radius: null
  surface_type: "Ice"
  seating_capacity: null
  teams:
    home_team:
      name: null
      colors: null
  facilities:
    locker_rooms: null
    concession_stands: null
    restrooms: null
  parking:
    capacity: null
    price: null
  scoreboard:
    # 4-sided polygon that maps out the scoreboard in the perspective view
    # Should be tlbr form, with values: [x, y]
    perspective_polygon: null
    position: upper-left
    projected_height: "%20"
    projected_width: "%10"
    scoreboard_scale: 1.0
    # Resize the extracted scoreboard before the bilinear perspective warp.
    resize_filter: bilinear
    # GPU unsharp mask after perspective correction; 0 disables it. Values above 2 can strongly amplify artifacts.
    sharpen_amount: 0.0
  end_zones:
    #
    # End zone start/stop thresholds (lines of the form (x1, y1), (x2, y2))
    #
    # Where we switch to end-zone view on the ldft
    left_start: null
    # Were we switch back to pan view on the lft
    left_stop: null
    # Where we switch to end-zone view on the ldft
    right_start: null
    # Were we switch back to pan view on the lft
    right_stop: null


  tracking:
    #
    # Some tracking config
    #
    # Legacy switch for count-based filtering. False keeps existing rink overrides disabled.
    cam_ignore_largest: true
    # Largest player areas to exclude from play tracking; 0 disables this filter.
    # Size filters always leave at least three players.
    cam_ignore_largest_count: 1
    # Optional area filter, applied after the largest-count exclusions.
    cam_ignore_oversized: false
    # Percent larger than the mean area of the OTHER remaining players.
    # 100 means more than twice that average; decisions use the same snapshot.
    cam_oversized_percent: 100
  camera:
    #
    # Rink-related tracking config
    #
    fixed_edge_rotation_angle: 10
    # Ratio of height and width for the "destination" box based upon what the "fast box" size is.
    # Making this ratio larger makes the destination box larger, which makes the camera less zoomed in
    follower_box_scale_width: 1.45
    follower_box_scale_height: 1.45
    # Minimum height for the aspect-ratio follower box, as a fraction of play height.
    # Smaller values allow more zoom-in.
    follower_box_min_height_ratio: 0.2
    # How readily the play-tracking camera zooms in. 25 preserves the native
    # 8%/10% sticky shrink thresholds; larger values zoom in sooner.
    zoom_in_aggressiveness: 25
    crop_image: true
    pre_clip: true
    max_speed_ratio_x: 1.0
    max_speed_ratio_y: 1.0
    max_accel_ratio_x: 1.0
    max_accel_ratio_y: 1.0
    color:
      white_balance:
        - 1.0
        - 1.0
        - 1.0
      brightness: 1.0
      exposure_ev: 0.0
      contrast: 1.0
      gamma: 1.0

    # Direction-change braking (stop dampening)
    # Frames to brake to a stop on direction change
    stop_on_dir_change_delay: 10
    # Cancel braking when inputs flip opposite (true/false)
    cancel_stop_on_opposite_dir: true
    # Consecutive opposite-direction frames required to cancel braking
    stop_cancel_hysteresis_frames: 2
    # Cooldown frames after a stop-delay finishes/cancels before another can start
    stop_delay_cooldown_frames: 2
    # When increasing speed toward destination, enforce a minimum number of frames
    # to reach the target along that axis (0 disables)
    time_to_dest_speed_limit_frames: 20
    # When time-to-dest limiting is active, snap to zero below this speed (px/frame)
    time_to_dest_stop_speed_threshold: 0.25

    # Resizing direction-change braking (size dampening)
    # Frames to brake to a stop on resize direction change
    resizing_stop_on_dir_change_delay: 4
    # Cancel resizing brake when inputs flip opposite (true/false)
    resizing_cancel_stop_on_opposite_dir: true
    # Consecutive opposite-direction frames required to cancel resize braking
    resizing_stop_cancel_hysteresis_frames: 10
    # Cooldown frames after a resize stop-delay finishes/cancels before another can start
    resizing_stop_delay_cooldown_frames: 2
    # When increasing size toward destination, enforce a minimum number of frames
    # to reach the target along that axis (0 disables)
    resizing_time_to_dest_speed_limit_frames: 10
    # When resize time-to-dest limiting is active, snap to zero below this speed (px/frame)
    resizing_time_to_dest_stop_speed_threshold: 0.25


    # Sticky translation
    sticky_size_ratio_to_frame_width: 10.0
    sticky_translation_gaussian_mult: 5.0
    unsticky_translation_size_ratio: 0.75

    # Camera controller (trunk) defaults
    controller: rule         # or 'transformer' / 'gpt' / 'drivegpt'
    camera_model: null       # path to camera checkpoint (.pt)
    camera_window: 8

    #
    # Configuration for breakaways
    #
    breakaway_detection:
      # Group velocities less than this are ignored
      min_considered_group_velocity: 3.0
      # What ratio of tracked players must be all reacting
      # to a breakaway?
      group_ratio_threshold: 0.5
      # What ratio of the group speed should we try to
      # apply within a single frame's speed adjustment?
      group_velocity_speed_ratio: 0.3
      # During a breakaway, what scale do we adjust the
      # maximum camera speed to allow for faster-than-normal tracking?
      scale_speed_constraints: 3.0
      # The number of frame steps to not allow any camera-stop conditions to
      # trigger such as cluster(s) direction change or "sticky translation" rules.
      # This is because the clusters may not have changed enough at the
      # beginning of a breakaway and may simply stop the camera movement
      # due to the cluster tracking rules.
      nonstop_delay_count: 2
      # When over-shooting the breakaway players, what scale do we apply
      # to the current speed each frame in order to slow it down?
      overshoot_scale_speed_ratio: 0.7
      # Alternatively, brake to a stop over N frames when overshooting
      overshoot_stop_delay_count: 6
      # After nonstop (breakaway catch-up) ends, optionally brake to stop over N frames
      post_nonstop_stop_delay_count: 6

debug:
  rgb_stats_check:
    enable: false

#
# Game config
#
game:
  name: null
  rink: null
  home: null
  away: null

  # Which sweater the home side wore for this game. Team affiliation is a
  # per-game appearance split, so nothing can infer "home" from pixels: the
  # clusterer ranks its two groups dark-vs-light and this bit names them.
  # `true` means home wore dark, `false` means home wore white/light. Leaving
  # it null is not a failure -- the overlay then reads DARK/LIGHT, which is
  # correct but unnamed, instead of guessing. League conventions differ
  # (NHL and most amateur leagues disagree), so this is per game rather
  # than a built-in rule.
  home_is_dark: null

  videos:
    left: null
    right: null

  clip_box: null
  boundaries:
    upper:
    upper_tune_position: null
    lower:
    lower_tune_position: null
    # For scaling to a new stitched size
    scale_width: null
    scale_height: null


