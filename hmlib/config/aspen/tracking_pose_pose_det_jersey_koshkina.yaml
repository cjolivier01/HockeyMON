aspen:
  minimal_context: true

  inference_pipeline:
    - type: LoadImageFromFile
    - type: HmCrop
      keys: [img]
    - type: HmImageToTensor
      keys: [img]
    - type: HmResize
      img_scale: [1312, 480]
      keep_ratio: true
      interpolation: area
    - type: HmPad
      pad_val: 114.0
      size_divisor: 32
    - type: mmdet.PackTrackInputs
      meta_keys: [img_metas]

  video_out_pipeline:
    - type: HmConfigureScoreboard
    - type: HmCaptureScoreboard
      scoreboard_scale: GLOBAL.rink.scoreboard.scoreboard_scale
    - type: HmPerspectiveRotation
      pre_clip: true
    - type: HmCropToVideoFrame
    - type: HmRenderScoreboard
      image_labels: [img, end_zone_img]
    - type: HmUnsharpMask
      enabled: false
      image_label: img
    - type: HmImageOverlays
      watermark_config:
        image: images/sports_ai_watermark.png

  plugins:
    stitching:
      class: hmlib.aspen.plugins.stitching_plugin.StitchingPlugin
      depends: []
      enabled: GLOBAL.stitching.enabled
      params:
        pto_project_file: GLOBAL.stitching.pto_project_file
        dir_name: GLOBAL.stitching.dir_name
        blend_mode: GLOBAL.stitching.blend_mode
        blend_feather_fraction: GLOBAL.stitching.blend_feather_fraction
        max_blend_levels: GLOBAL.stitching.max_blend_levels
        python_blender: GLOBAL.stitching.python_blender
        use_cuda_pano_n: GLOBAL.stitching.use_cuda_pano_n
        minimize_blend: GLOBAL.stitching.minimize_blend
        dtype: GLOBAL.stitching.dtype
        no_cuda_streams: GLOBAL.stitching.no_cuda_streams
        post_stitch_rotate_degrees: GLOBAL.stitching.post_stitch_rotate_degrees
        left_color_pipeline: GLOBAL.stitching.left_stitch_pipeline
        right_color_pipeline: GLOBAL.stitching.right_stitch_pipeline
        capture_rgb_stats: GLOBAL.stitching.capture_rgb_stats
        max_output_width: GLOBAL.stitching.max_output_width
        cache_rotation_grid: GLOBAL.stitching.cache_rotation_grid

    image_prep:
      class: hmlib.aspen.plugins.image_prep_plugin.ImagePrepPlugin
      depends: [stitching]
      params: {}

    model_factory:
      class: hmlib.aspen.plugins.model_factory_plugin.ModelFactoryPlugin
      depends: []
      params:
        model_class: hmlib.models.end_to_end_plugin.HmEndToEnd
        # post_* pipelines not used for rink mask
        post_tracking_pipeline: []

    boundaries:
      class: hmlib.aspen.plugins.boundaries_plugin.BoundariesPlugin
      depends: [model_factory]
      params: {}

    pose_factory:
      class: hmlib.aspen.plugins.pose_factory_plugin.PoseInferencerFactoryPlugin
      depends: []
      params:
        pose_config: GLOBAL.model.pose_coco.config
        pose_checkpoint: GLOBAL.model.pose_coco.checkpoint
        show_progress: false

    pose_join:
      class: hmlib.aspen.plugins.join_plugin.JoinPlugin
      depends: [image_prep, pose_factory]
      params:
        required_plugins: [image_prep, pose_factory]
        output_key: pose_joined

    pose:
      class: hmlib.aspen.plugins.pose_plugin.PosePlugin
      depends: [pose_join]
      params:
        plot_pose: GLOBAL.plot.plot_pose

    save_pose:
      class: hmlib.aspen.plugins.save_plugins.SavePosePlugin
      depends: [pose]
      params: {}

    pose_to_det:
      class: hmlib.aspen.plugins.pose_to_det_plugin.PoseToDetPlugin
      depends: [pose]
      params: {}

    save_detections:
      class: hmlib.aspen.plugins.save_plugins.SaveDetectionsPlugin
      depends: [pose_to_det]
      params: {}

    ice_config:
      class: hmlib.aspen.plugins.ice_rink_boundaries_plugins.IceRinkSegmConfigPlugin
      depends: [save_detections]
      params: {}

    ice_boundaries_join:
      class: hmlib.aspen.plugins.join_plugin.JoinPlugin
      depends: [pose_to_det, ice_config]
      params:
        required_plugins: [pose_to_det, ice_config]
        output_key: ice_boundaries_joined

    ice_boundaries:
      class: hmlib.aspen.plugins.ice_rink_boundaries_plugins.IceRinkSegmBoundariesPlugin
      depends: [ice_boundaries_join]
      params:
        raise_bbox_center_by_height_ratio: GLOBAL.ice_boundaries.raise_bbox_center_by_height_ratio
        lower_bbox_bottom_by_height_ratio: GLOBAL.ice_boundaries.lower_bbox_bottom_by_height_ratio
        max_detections_in_mask: 50

    tracker_join:
      class: hmlib.aspen.plugins.join_plugin.JoinPlugin
      depends: [pose_to_det, ice_boundaries, model_factory, boundaries]
      params:
        required_plugins: [pose_to_det, ice_boundaries, model_factory, boundaries]
        output_key: tracker_joined

    tracker:
      class: hmlib.aspen.plugins.tracker_plugin.TrackerPlugin
      depends: [tracker_join]
      params: {}

    # Between the tracker and the trunks that render, so `team_results` is in
    # the context before `overlays` runs rather than racing it. The trunk only
    # reads tracks and publishes labels.
    # Pose is available in this graph, so torso crops are shoulder/hip guided.
    team_affiliation:
      class: hmlib.aspen.plugins.team_plugin.TeamAffiliationPlugin
      depends: [tracker]
      enabled: GLOBAL.team.enabled
      params:
        backend: GLOBAL.team.backend
        warmup_samples: GLOBAL.team.warmup_samples
        refit_interval: GLOBAL.team.refit_interval
        min_margin: GLOBAL.team.min_margin
        frame_stride: GLOBAL.team.frame_stride
        min_track_height: GLOBAL.team.min_track_height
        home_is_dark: GLOBAL.game.home_is_dark
        prtreid_weights: GLOBAL.team.prtreid.weights
        prtreid_backbone_weights: GLOBAL.team.prtreid.backbone_weights
        prtreid_device: GLOBAL.team.prtreid.device

    jersey_numbers:
      class: hmlib.aspen.plugins.jersey_koshkina_plugin.KoshkinaJerseyNumberPlugin
      depends: [team_affiliation]
      params:
        # ROI selection: bbox (default), pose, or sam
        roi_mode: pose

        # Configure PARSeq STR (jersey-number pipeline)
        parseq_weights: "pretrained/parseq/jersey/hockey/epoch=3-step=95-val_accuracy=98.7903-val_NED=99.3952.ckpt"
        parseq_device: cuda
        # Legacy STR fields are ignored by this trunk but kept for compatibility
        str_backend: parseq
        # parseq_weights: /abs/path/to/parseq.ckpt   # optional; if omitted, tries pretrained
        # parseq_device: cuda                        # optional; defaults to image device

        # Legibility filtering
        legibility_enabled: true
        legibility_weights: pretrained/legibility_classifier/hockey/legibility_resnet34_hockey_20240201.pth
        legibility_threshold: 0.5

        # Optional: add a sleeve ROI when the pose looks side-on (orthogonal to camera)
        # side_view_enabled: true
        # side_view_shoulder_ratio_thresh: 0.22
        # side_view_vote_scale: 1.25

        # ReID occlusion/outlier removal
        reid_enabled: false
        reid_backend: resnet   # 'resnet' or 'centroid'
        reid_backbone: resnet34
        reid_threshold: 3.0
        # centroid_reid_path: /abs/path/to/centroid-reid  # optional; or set env HM_CENTROID_REID_PATH
        # centroid_reid_device: cuda

        # SAM refinement (optional; requires segment_anything)
        sam_enabled: false
        # roi_mode: sam
        # sam_checkpoint: /abs/path/to/sam_vit_b.pth
        # sam_model_type: vit_b
        # sam_device: cuda

        # OCR thresholds when using MMOCR
        det_thresh: 0.5
        rec_thresh: 0.8

    save_tracking:
      class: hmlib.aspen.plugins.save_plugins.SaveTrackingPlugin
      depends: [save_tracking_join]
      params: {}

    save_tracking_join:
      class: hmlib.aspen.plugins.join_plugin.JoinPlugin
      depends: [jersey_numbers, pose]
      params:
        required_plugins: [jersey_numbers, pose]
        output_key: save_tracking_joined

    postprocess:
      class: hmlib.aspen.plugins.postprocess_plugin.CamPostProcessPlugin
      depends: [jersey_numbers]
      params: {}

    overlays:
      class: hmlib.aspen.plugins.overlay_plugin.OverlayPlugin
      depends: [jersey_numbers]
      enabled: true
      params:
        plot_pose: GLOBAL.plot.plot_pose
        plot_jersey_numbers: GLOBAL.plot.plot_jersey_numbers
        plot_teams: GLOBAL.plot.plot_teams
        plot_referees: GLOBAL.plot.plot_referees
        plot_tracking: GLOBAL.plot.plot_individual_player_tracking
        plot_all_detections: GLOBAL.plot.plot_all_detections
        plot_trajectories: GLOBAL.plot.plot_trajectories
        draw_tracking_circles: GLOBAL.plot.plot_tracking_circles
        print_available: false
